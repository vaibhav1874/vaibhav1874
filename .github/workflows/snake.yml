name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours
  push:
    branches:
      - main
  workflow_dispatch:           # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure dist directory exists
        run: mkdir -p dist

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vaibhav1874
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: vaibhav1874
          options: "theme=react-dark&bg_color=0d0d1a&color=00d4ff&line=7b2ff7&point=a855f7&area=true&hide_border=true"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=vaibhav1874&theme=tokyonight&row=1&column=6&no-bg=true&no-frame=true&title_color=a855f7&icon_color=00d4ff"
          path: dist/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

